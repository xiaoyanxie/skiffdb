version: 2

project_name: skiffdb

before:
  hooks:
    - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
    - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
    - make proto

builds:
  - id: skiffdb-server
    main: .
    binary: skiffdb-server
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Tag}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: archive
    builds: [skiffdb-server]
    format_overrides:
      - goos: windows
        format: zip
    name_template: "skiffdb-server_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto
